name: Update RSS feeds

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update feeds
        run: |
          python scrapers/paul-graham.py
          python scrapers/gwern-newsletter.py
          python scripts/update-site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feeds/

          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi

          git commit -m "Update RSS feeds"
          git push
